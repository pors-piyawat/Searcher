<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ค้นหาห้องและที่นั่งสอบด้วยรหัสนักศึกษา">
<title>Searcher</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root {
  --bg:          #edf1f7;
  --fg:          #0c1e35;
  --surface:     #ffffff;
  --surface-2:   #e2eaf5;
  --primary:     #0d2b5e;
  --primary-mid: #184a9a;
  --primary-hi:  #2a62cc;
  --accent:      #0d9488;
  --accent-warm: #14b8a6;
  --seat-empty:  #c6d4e6;
  --seat-empty-t:#7890a8;
  --seat-taken:  #3d6aaa;
  --seat-taken-t:#dce8ff;
  --seat-you:    #0d9488;
  --seat-you-t:  #ffffff;
  --border:      #c2d0e2;
  --err-bg:      #fff2f2;
  --err-fg:      #b02020;
  --muted:       #5c7898;
  color-scheme: light;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#091625;--fg:#d8e8f8;--surface:#102035;--surface-2:#192e48;
    --primary:#2c5ab0;--primary-mid:#3d78d8;--primary-hi:#5a95f5;
    --accent:#2dd4bf;--accent-warm:#5eead4;
    --seat-empty:#1b3050;--seat-empty-t:#3d6080;
    --seat-taken:#264880;--seat-taken-t:#90b8e8;
    --seat-you:#14b8a6;--seat-you-t:#091625;
    --border:#1e3454;--err-bg:#200e0e;--err-fg:#f06060;--muted:#4a7298;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#091625;--fg:#d8e8f8;--surface:#102035;--surface-2:#192e48;
  --primary:#2c5ab0;--primary-mid:#3d78d8;--primary-hi:#5a95f5;
  --accent:#2dd4bf;--accent-warm:#5eead4;
  --seat-empty:#1b3050;--seat-empty-t:#3d6080;
  --seat-taken:#264880;--seat-taken-t:#90b8e8;
  --seat-you:#14b8a6;--seat-you-t:#091625;
  --border:#1e3454;--err-bg:#200e0e;--err-fg:#f06060;--muted:#4a7298;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Sarabun',system-ui,sans-serif;font-size:16px;line-height:1.65;}

/* ── Header ── */
.hdr{background:linear-gradient(160deg,var(--primary) 0%,#0a2149 100%);padding-block:28px 24px;padding-inline:max(20px,env(safe-area-inset-left,0px));text-align:center;}
.hdr-eye{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-warm);margin-bottom:6px;}
.hdr h1{margin:0;font-size:clamp(30px,8vw,44px);font-weight:800;color:#fff;line-height:1.1;}
.brand{display:inline-flex;align-items:center;gap:12px;}
.brand-mark{width:1.05em;height:1.05em;flex-shrink:0;}
.brand-mark rect{fill:rgba(255,255,255,.28);}
.brand-mark rect.hl{fill:var(--accent-warm);}
.brand-word{font-family:'Sarabun',sans-serif;letter-spacing:-.02em;}
.brand-word span{color:var(--accent-warm);}
.hdr-sub{margin-top:6px;font-size:14px;color:rgba(255,255,255,.6);}
.gold-stripe{height:4px;background:linear-gradient(90deg,var(--accent),var(--accent-warm) 50%,var(--accent));}

/* ── Wrap ── */
.wrap{max-width:1060px;margin:0 auto;padding-inline:max(14px,env(safe-area-inset-left,0px));padding-block:24px;display:flex;flex-direction:column;gap:16px;}

/* ── Search ── */
.search-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px 20px;text-align:center;}
.s-lbl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
.s-row{display:flex;gap:8px;max-width:420px;margin:0 auto;}
.s-inp{flex:1;min-width:0;padding:12px 14px;font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;letter-spacing:.08em;border:2px solid var(--border);border-radius:9px;background:var(--surface);color:var(--fg);outline:none;text-transform:uppercase;transition:border-color .18s,box-shadow .18s;}
.s-inp:focus{border-color:var(--primary-hi);box-shadow:0 0 0 3px rgba(42,98,204,.14);}
.s-inp::placeholder{opacity:.28;font-weight:400;}
.s-btn{padding:12px 20px;background:var(--primary-mid);color:#fff;border:none;border-radius:9px;font-family:'Sarabun',sans-serif;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .18s,transform .1s;}
.s-btn:hover{background:var(--primary-hi);}
.s-btn:disabled{opacity:.7;cursor:wait;}
.s-btn:active{transform:scale(.96);}
.s-hint{font-size:12px;color:var(--muted);margin-top:9px;}
.s-hint code{font-family:'IBM Plex Mono',monospace;background:var(--surface-2);padding:2px 6px;border-radius:4px;}

/* ── Error ── */
.err-card{background:var(--err-bg);border:1.5px solid var(--err-fg);border-radius:11px;padding:13px 18px;text-align:center;color:var(--err-fg);font-weight:600;}

/* ── Info strip ── */
.info-strip{background:var(--surface);border:1px solid var(--border);border-radius:13px;overflow:hidden;}
.info-hdr{background:var(--primary);padding:9px 18px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.7);}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));}
.info-cell{padding:15px 20px;border-right:1px solid var(--border);}
.info-cell:last-child{border-right:none;}
.i-lbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.i-val{font-size:19px;font-weight:700;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;word-break:break-all;}
.i-val.iv-room{font-size:24px;color:var(--primary-hi);}
.i-val.iv-adv{font-family:'Sarabun',sans-serif;font-size:17px;line-height:1.35;word-break:normal;}
.i-val.iv-zone{font-size:24px;color:var(--accent);}
.i-val.iv-seat{font-size:22px;color:var(--accent);}
.i-sub{font-size:12px;color:var(--muted);margin-top:2px;font-family:'Sarabun',sans-serif;}

/* ── Map card ── */
.map-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;}

/* Tab bar */
.zone-tabbar{display:flex;gap:5px;padding:12px 15px;border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center;}
.ztab-sep{width:1px;background:var(--border);align-self:stretch;margin-inline:4px;}
.ztab-lbl{font-family:'Sarabun',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);align-self:center;padding-inline:1px;}
.ztab{padding:5px 11px;background:var(--surface-2);border:1.5px solid var(--border);border-radius:7px;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .18s;}
.ztab:hover{border-color:var(--primary-hi);color:var(--primary-hi);}
.ztab.zt-active{background:var(--primary-mid);border-color:var(--primary-mid);color:#fff;}
.ztab.zt-found{background:var(--accent);border-color:var(--accent-warm);color:#fff;}
.ztab.zt-found.zt-active{box-shadow:0 0 0 3px rgba(13,148,136,.3);}

/* Map body */
.map-body{padding:16px 14px 20px;overflow-x:auto;}

/* ══ ALL-ZONES THEATER VIEW ══ */
.theater-wrap{display:flex;flex-direction:column;align-items:center;gap:0;min-width:700px;}

/* Venue name plate */
.venue-nameplate{
  background:var(--primary);color:#fff;
  font-size:13px;font-weight:700;letter-spacing:.12em;
  padding:6px 24px;border-radius:6px;
  margin-bottom:10px;text-align:center;
}

/* Floor sections */
.theater-floor{display:flex;gap:6px;justify-content:center;align-items:flex-start;}

/* Aisle separator between floors */
.floor-sep{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:center;padding:6px 0;width:100%;border-top:1px dashed var(--border);border-bottom:1px dashed var(--border);margin-block:6px;}

/* Center aisle between B and C (lower floor) */
.center-aisle{width:14px;min-width:14px;flex-shrink:0;}

/* Stage banner */
.stage-banner{
  width:100%;max-width:640px;
  background:linear-gradient(135deg,#1a5a3a 0%,#0d3d27 100%);
  border:2px solid #2a7a52;border-radius:7px;
  color:#7de8c0;font-size:11px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;
  text-align:center;padding:7px 0;margin-top:10px;
}

/* Zone block */
.tzone{
  display:flex;flex-direction:column;align-items:center;
  gap:1px;cursor:pointer;border-radius:8px;
  padding:4px 3px 4px;border:1.5px solid transparent;
  transition:border-color .18s,background .18s;
}
.tzone:hover{border-color:var(--primary-hi);background:rgba(42,98,204,.06);}
.tzone.tz-found{border-color:var(--accent-warm);background:rgba(13,148,136,.09);}
.tzone.tz-active{border-color:var(--primary-hi);background:rgba(42,98,204,.09);}
.tzone.tz-found.tz-active{border-color:var(--accent-warm);background:rgba(13,148,136,.14);}

.tz-label{
  font-size:11px;font-weight:800;font-family:'IBM Plex Mono',monospace;
  color:var(--primary-hi);margin-bottom:3px;
}
.tzone.tz-found .tz-label{color:var(--accent);}

/* Small seats (all-zones view) */
.trow{display:flex;gap:1px;justify-content:center;}
.tseat{width:8px;height:8px;border-radius:1.5px;flex-shrink:0;}
.tseat.s-empty{background:var(--seat-empty);}
.tseat.s-taken{background:var(--seat-taken);}
.tseat.s-you{background:var(--seat-you);box-shadow:0 0 0 1.5px var(--accent-warm);}

.tz-sub{font-size:8px;color:var(--muted);text-align:center;margin-top:3px;line-height:1.3;}

/* ══ SINGLE ZONE DETAIL VIEW ══ */
.zone-detail-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.zone-badge{background:var(--primary);color:#fff;font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:700;padding:4px 14px;border-radius:8px;}
.zone-info-text{font-size:13px;color:var(--muted);}
.back-btn{margin-left:auto;padding:5px 12px;background:var(--surface-2);border:1.5px solid var(--border);border-radius:7px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .18s;font-family:'Sarabun',sans-serif;}
.back-btn:hover{border-color:var(--primary-hi);color:var(--primary-hi);}

.legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
.leg-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);font-weight:500;}
.leg-pip{width:12px;height:12px;border-radius:3px;}
.leg-pip.lp-you{background:var(--seat-you);}
.leg-pip.lp-taken{background:var(--seat-taken);}
.leg-pip.lp-empty{background:var(--seat-empty);}

.zone-inner{overflow-x:auto;padding-bottom:4px;}
.stage-mini{
  background:linear-gradient(135deg,#1a5a3a,#0d3d27);
  border:1px solid #2a7a52;border-radius:5px;
  color:#7de8c0;font-size:9px;font-weight:800;letter-spacing:.2em;
  text-align:center;padding:4px 0;margin-top:8px;
}
.zone-back-label{font-size:10px;color:var(--muted);text-align:center;padding-bottom:5px;font-weight:600;letter-spacing:.08em;}

/* Large seats */
.seat-row{display:flex;align-items:center;gap:2px;margin-bottom:2px;justify-content:center;}
.row-num{width:22px;min-width:22px;font-size:9px;font-family:'IBM Plex Mono',monospace;color:var(--muted);text-align:right;flex-shrink:0;}
.seat-cells{display:flex;gap:2px;justify-content:center;}
.seat{width:22px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:8px;font-family:'IBM Plex Mono',monospace;font-weight:500;flex-shrink:0;cursor:default;user-select:none;transition:transform .14s;}
.seat.s-empty{background:var(--seat-empty);color:var(--seat-empty-t);}
.seat.s-taken{background:var(--seat-taken);color:var(--seat-taken-t);}
.seat.s-you{background:var(--seat-you);color:var(--seat-you-t);font-weight:900;font-size:11px;box-shadow:0 0 0 2.5px var(--accent-warm);animation:glow 1.8s ease-in-out infinite;z-index:1;position:relative;}
@keyframes glow{
  0%,100%{box-shadow:0 0 0 2.5px var(--accent-warm),0 2px 10px rgba(13,148,136,.3);}
  50%     {box-shadow:0 0 0 4px var(--accent-warm),0 2px 18px rgba(13,148,136,.5);}
}
.seat:hover:not(.s-you){transform:scale(1.25);}
@media(prefers-reduced-motion:reduce){.seat.s-you{animation:none;box-shadow:0 0 0 3.5px var(--accent-warm);}}
@media(max-width:500px){
  .seat{width:18px;height:18px;font-size:7px;}
  .ztab{padding:4px 8px;font-size:12px;}
}

/* ══ Venue SVG (matches real seating plan) ══ */
:root{--seat-stroke:#9fb2ca;--zone-label:#0d2b5e;--zone-halo:#ffffff;--block:#8b919b;}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--seat-stroke:#2c4770;--zone-label:#eaf2ff;--zone-halo:#0b1a2e;--block:#34465e;}}
:root[data-theme="dark"]{--seat-stroke:#2c4770;--zone-label:#eaf2ff;--zone-halo:#0b1a2e;--block:#34465e;}
.venue-title{text-align:center;font-weight:700;font-size:15px;color:var(--primary-hi);margin-bottom:4px;}
.venue-svg{display:block;width:100%;min-width:720px;height:auto;}
.map-hint{text-align:center;font-size:12px;color:var(--muted);margin-top:6px;}
.sv-seat{fill:var(--seat-empty);stroke:var(--seat-stroke);stroke-width:1;}
.sv-seat.s-taken{fill:var(--seat-taken);}
.sv-seat.s-you{fill:var(--seat-you);stroke:var(--accent-warm);stroke-width:3;}
.sv-ring{fill:none;stroke:var(--accent-warm);stroke-width:4;pointer-events:none;transform-box:fill-box;transform-origin:center;animation:ring 1.6s ease-out infinite;}
@keyframes ring{0%{opacity:.95;transform:scale(.5)}100%{opacity:0;transform:scale(1.8)}}
@media(prefers-reduced-motion:reduce){.sv-ring{animation:none;}}
.sv-zone{cursor:pointer;}
.sv-hit{fill:transparent;stroke:transparent;stroke-width:2.5;transition:fill .18s,stroke .18s;}
.sv-zone:hover .sv-hit{fill:rgba(42,98,204,.07);stroke:var(--primary-hi);}
.sv-zone.found .sv-hit{fill:rgba(13,148,136,.10);stroke:var(--accent-warm);}
.sv-label{font:800 78px 'Sarabun',sans-serif;fill:var(--zone-label);stroke:var(--zone-halo);stroke-width:10px;stroke-linejoin:round;paint-order:stroke fill;text-anchor:middle;dominant-baseline:central;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25));transition:fill .18s;}
.sv-label.sm{font-size:50px;stroke-width:8px;}
.sv-zone:hover .sv-label{fill:var(--primary-hi);}
.sv-zone.found .sv-label{fill:var(--accent);}
.sv-block{fill:var(--surface);}
.sv-stair-bg{fill:var(--surface);stroke:var(--fg);stroke-width:1.5;}
.sv-stroke{stroke:var(--fg);stroke-width:1.5;}
.sv-rail{stroke:var(--fg);stroke-width:2;}
.sv-step{stroke:var(--fg);stroke-width:1;opacity:.7;}
.sv-podium{fill:#e8762a;}
.sv-dash{stroke:var(--fg);stroke-width:4;stroke-dasharray:14 10;fill:none;opacity:.5;}
.sv-dash.thin{stroke-width:2.5;stroke-dasharray:8 7;}
.sv-stage{fill:var(--surface-2);stroke:var(--border);stroke-width:1.5;}
.sv-stage-arc{fill:none;stroke:var(--muted);stroke-width:2;}
.sv-stage-txt{font:800 26px 'Sarabun',sans-serif;fill:var(--primary-hi);text-anchor:middle;dominant-baseline:central;letter-spacing:3px;}
.sv-rownum{font:600 11px 'IBM Plex Mono',monospace;fill:#fff;text-anchor:middle;dominant-baseline:central;opacity:.9;pointer-events:none;}

/* Detail view: rows keep the real plan's shape */
.zgrid{--cell:24px;width:max-content;margin:0 auto;}
.zgrid .seat-row{justify-content:flex-start;}
.zgrid .seat-cells{justify-content:flex-start;}
@media(max-width:500px){.zgrid{--cell:20px;}}

/* Row-only assignment: highlight whole row */
.sv-seat.s-row{fill:var(--seat-you);stroke:var(--accent-warm);stroke-width:1.5;}
.sv-rowhl{fill:rgba(20,184,166,.15);stroke:var(--accent-warm);stroke-width:3;pointer-events:none;animation:rowpulse 1.6s ease-in-out infinite;}
@keyframes rowpulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.25}}
.seat.s-row{background:var(--seat-you);color:var(--seat-you-t);font-weight:700;}
.seat-row.row-hl .seat-cells{border-radius:6px;box-shadow:0 0 0 3px var(--accent-warm);animation:glow 1.8s ease-in-out infinite;}
.seat-row.row-hl .row-num{color:var(--accent);font-weight:800;}
@media(prefers-reduced-motion:reduce){.sv-rowhl,.seat-row.row-hl .seat-cells{animation:none;}}
.map-hint.found{font-size:14px;color:var(--fg);margin-top:10px;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;}
.map-hint.found b{color:var(--accent);}
.hint-btn{padding:6px 14px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-family:'Sarabun',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:filter .18s;}
.hint-btn:hover{filter:brightness(1.1);}
</style>
</head>
<body>
<header class="hdr">
  <h1 class="brand">
    <svg class="brand-mark" viewBox="2 4 36 34" aria-hidden="true">
      <rect x="4" y="6" width="9" height="8" rx="2"/><rect x="15.5" y="6" width="9" height="8" rx="2"/><rect x="27" y="6" width="9" height="8" rx="2"/>
      <rect x="4" y="17" width="9" height="8" rx="2"/><rect class="hl" x="15.5" y="17" width="9" height="8" rx="2"/><rect x="27" y="17" width="9" height="8" rx="2"/>
      <rect x="4" y="28" width="9" height="8" rx="2"/><rect x="15.5" y="28" width="9" height="8" rx="2"/><rect x="27" y="28" width="9" height="8" rx="2"/>
    </svg>
    <span class="brand-word">Search<span>er</span></span>
  </h1>
</header>
<div class="gold-stripe"></div>

<div class="wrap">

  <div class="search-card">
    <div class="s-lbl">ค้นหาด้วยรหัสนักศึกษา</div>
    <div class="s-row">
      <input class="s-inp" id="sid" type="text" placeholder="B0000000"
             maxlength="10" autocomplete="off" autocorrect="off"
             autocapitalize="characters" spellcheck="false">
      <button class="s-btn" onclick="doSearch()">ค้นหา</button>
    </div>
    <div class="s-hint">ตัวอย่าง: <code>B7012345</code></div>
  </div>

  <div class="err-card" id="errCard" hidden>
    ไม่พบรหัสนักศึกษา "<span id="errId"></span>" ในระบบ
  </div>

  <div class="info-strip" id="infoStrip" hidden>
    <div class="info-hdr">ข้อมูลที่นั่งสอบ</div>
    <div class="info-grid">
      <div class="info-cell">
        <div class="i-lbl">รหัสนักศึกษา</div>
        <div class="i-val" id="rId">—</div>
      </div>
      <div class="info-cell">
        <div class="i-lbl">อาจารย์ที่ปรึกษา</div>
        <div class="i-val iv-adv" id="rAdvisor">—</div>
      </div>
      <div class="info-cell">
        <div class="i-lbl">ห้อง / กลุ่ม</div>
        <div class="i-val iv-room" id="rRoom">—</div>
      </div>
      <div class="info-cell">
        <div class="i-lbl">โซน</div>
        <div class="i-val iv-zone" id="rZone">—</div>
        <div class="i-sub" id="rZoneSub">—</div>
      </div>
      <div class="info-cell">
        <div class="i-lbl">ที่นั่ง / พื้นที่</div>
        <div class="i-val iv-seat" id="rSeat">—</div>
        <div class="i-sub" id="rDesc">—</div>
      </div>
    </div>
  </div>

  <!-- Map card — always visible -->
  <div class="map-card">
    <div class="zone-tabbar" id="tabBar">
      <button class="ztab zt-active" data-zone="all">ทั้งหมด</button>
      <div class="ztab-sep"></div>
      <span class="ztab-lbl">ชั้นล่าง</span>
      <button class="ztab" data-zone="A">A</button>
      <button class="ztab" data-zone="B">B</button>
      <button class="ztab" data-zone="C">C</button>
      <button class="ztab" data-zone="D">D</button>
      <div class="ztab-sep"></div>
      <span class="ztab-lbl">ชั้นบน</span>
      <button class="ztab" data-zone="E">E</button>
      <button class="ztab" data-zone="F">F</button>
      <button class="ztab" data-zone="G">G</button>
      <button class="ztab" data-zone="H">H</button>
      <button class="ztab" data-zone="I">I</button>
    </div>
    <div class="map-body" id="mapBody"></div>
  </div>

</div>

<script>
// ══════════════════════════════════════════════════════
//  VENUE DATA — จำนวนที่นั่งต่อแถว แต่ละโซน
//
//  ผัง (มองจากบน เวทีอยู่ด้านล่าง):
//
//   ┌─[E]─[F]──────[G]──────[H]─[I]─┐  ← ชั้นบน (บัลโคนี, แถว 17–30)
//   └─────────────────────────────────┘
//   ┌─[A]──[B]───────────[C]──[D]────┐  ← ชั้นล่าง (แถว 1–16)
//   └─────────────────────────────────┘
//              ▬ เวที (STAGE) ▬
//
//  แถวที่ 1 = ใกล้เวทีที่สุด  |  แถวสูง = ไกลจากเวที
// ══════════════════════════════════════════════════════
const VENUE = {
  // ── ชั้นล่าง (แถว 1–16) ──────────────────────────────
  A:{startRow:1, floor:'ชั้นล่าง ซ้าย',
     seatCounts:[11,12,13,13,14,15,15,16,17,17,18,19,19,20,21,22]},
  B:{startRow:1, floor:'ชั้นล่าง กลาง-ซ้าย',
     seatCounts:[8,9,9,10,11,12,12,13,13,14,15,16,17,17,18,19]},
  C:{startRow:1, floor:'ชั้นล่าง กลาง-ขวา',
     seatCounts:[8,9,9,10,11,12,12,13,13,14,15,16,17,17,18,19]},
  D:{startRow:1, floor:'ชั้นล่าง ขวา',
     seatCounts:[11,12,13,13,14,15,15,16,17,17,18,19,19,20,21,22]},
  // ── ชั้นบน / บัลโคนี ────────────────────────────────
  E:{startRow:17, floor:'ชั้นบน ซ้าย',
     seatCounts:[21,21,22,17,9,4]},           // แถว 17–22
  F:{startRow:17, floor:'ชั้นบน กลาง-ซ้าย',
     seatCounts:[16,16,17,17,18,19,19,17,15,13,11,8,7,5]}, // แถว 17–30
  G:{startRow:25, floor:'ชั้นบน กลาง',
     seatCounts:[5,5,5,5,5,5]},               // แถว 25–30
  H:{startRow:17, floor:'ชั้นบน กลาง-ขวา',
     seatCounts:[16,17,17,18,18,18,19,17,15,13,11,9,7]},   // แถว 17–29
  I:{startRow:17, floor:'ชั้นบน ขวา',
     seatCounts:[21,21,22,16,9,4]},           // แถว 17–22
};

// ══════════════════════════════════════════════════════
//  กลุ่ม/ห้อง → พื้นที่นั่ง
//  ใส่ชื่อห้องกับช่วงแถวที่จองไว้ แล้วนักศึกษาในห้องนั้น
//  ไม่ต้องใส่รหัสที่นั่งทีละคน (เว้นช่องที่ 3 เป็น "")
//    "D01-D06" = โซน D แถว 1 ถึง 6   |  "A05" = โซน A แถว 5
// ══════════════════════════════════════════════════════
const GROUPS = {
  "B1217": "D01-D06",   // 75 คน (แถว 1–6 ของโซน D มี 78 ที่นั่ง)
};

// ══════════════════════════════════════════════════════
//  ข้อมูลนักศึกษา  [รหัส, ห้อง/กลุ่ม, รหัสที่นั่ง, อาจารย์ที่ปรึกษา]
//  อาจารย์ที่ปรึกษาใส่หรือไม่ใส่ก็ได้
//  รหัสที่นั่งใส่ได้ 4 แบบ:
//    "A05-7"    ที่นั่งเดียว (โซน A แถว 5 ที่นั่ง 7)
//    "A05"      ทั้งแถว
//    "D01-D06"  หลายแถว
//    ""         ใช้พื้นที่ของห้อง/กลุ่มตาม GROUPS ด้านบน
//  ★ แทนที่ด้วยข้อมูลจริงก่อนใช้งาน ★
// ══════════════════════════════════════════════════════
const DATA = [
  // ข้อมูลอยู่ใน Google Sheets แล้ว (ดู API_URL ด้านล่าง)
];

// ── Lookups ──────────────────────────────────────────
const byId={}, bySeat={};
for(const [id,room,s0,advisor] of DATA){
  const seat=(s0||GROUPS[room]||'').toUpperCase();
  byId[id.toUpperCase()]={id,room,seat,advisor:advisor||''};
  bySeat[room+':'+seat]=id;
}

// ── Helpers ──────────────────────────────────────────
function endRow(z){const v=VENUE[z];return v?v.startRow+v.seatCounts.length-1:'?';}
function totalSeats(z){return VENUE[z]?VENUE[z].seatCounts.reduce((a,b)=>a+b,0):0;}
function parseSeat(code){
  let m=code.match(/^([A-Z])(\d+)-([A-Z])(\d+)$/);
  if(m&&m[1]===m[3]){const a=+m[2],b=+m[4];return{zone:m[1],row:Math.min(a,b),rowEnd:Math.max(a,b),seat:null};}
  m=code.match(/^([A-Z])(\d+)(?:-(\d+))?$/);
  return m?{zone:m[1],row:+m[2],rowEnd:+m[2],seat:m[3]?+m[3]:null}:null;
}
function inFoundRows(z,r){const p=foundEntry?parseSeat(foundEntry.seat):null;return !!(p&&p.seat==null&&p.zone===z&&r>=p.row&&r<=p.rowEnd);}
function rowOnly(){const p=foundEntry?parseSeat(foundEntry.seat):null;return !!(p&&p.seat==null);}
function descSeat(p){if(!p)return'';const v=VENUE[p.zone];const rows=p.rowEnd>p.row?`แถวที่ ${p.row}–${p.rowEnd}`:`แถวที่ ${p.row}`;return`โซน ${p.zone}${v?' ('+v.floor+')':''} · ${rows} · ${p.seat==null?'นั่งได้ทุกที่นั่งใน'+(p.rowEnd>p.row?'แถวเหล่านี้':'แถวนี้'):'ที่นั่งที่ '+p.seat}`;}

// ── State ────────────────────────────────────────────
let activeZone='all', foundEntry=null;

// ── Tabs ─────────────────────────────────────────────
function updateTabs(){
  const foundZone=foundEntry?parseSeat(foundEntry.seat)?.zone:null;
  document.querySelectorAll('.ztab').forEach(btn=>{
    const z=btn.dataset.zone;
    btn.classList.toggle('zt-active',z===activeZone);
    if(z&&z!=='all')
      btn.classList.toggle('zt-found',z===foundZone);
  });
}
document.getElementById('tabBar').addEventListener('click',e=>{
  const btn=e.target.closest('.ztab');
  if(btn&&btn.dataset.zone) selectZone(btn.dataset.zone);
});

function selectZone(z){
  activeZone=z;
  updateTabs();
  z==='all'?renderAll():renderSingle(z);
}

// ══════════════════════════════════════════════════════
//  GEOMETRY — พิกัดแต่ละแถว วัดจากผังจริง (หน่วย = พิกเซลของรูปผัง)
//  แต่ละโซนชิดขอบด้านทางเดิน/ผนังด้านใน แล้วแผ่ออกด้านนอก:
//    A,B,F  ชิดขวา     C,D,H,G  ชิดซ้าย
//    E      ขอบขวาเฉียงตามเส้นประ   I  ขอบซ้ายเฉียงตามเส้นประ
// ══════════════════════════════════════════════════════
const P=15.1, SEAT_W=13, SEAT_H=11;
const GEO={
  A:{right:605}, B:{right:927}, C:{left:1003}, D:{left:1308},
  E:{rightByRow:[587,587,570,570,555,540]},
  F:{right:860}, G:{left:921}, H:{left:1057},
  I:{leftByRow:[1332,1332,1347,1362,1362,1362]},
};
function rowX0(z,i){
  const g=GEO[z], n=VENUE[z].seatCounts[i];
  if(g.left!=null) return g.left;
  if(g.right!=null) return g.right-n*P;
  if(g.leftByRow) return g.leftByRow[i];
  return g.rightByRow[i]-n*P;
}
function rowY(z,i){
  const r=VENUE[z].startRow+i;
  return r>=17 ? 475-(r-17)*25.2 : 895-(r-1)*25.27;
}
function zoneBox(z){
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  VENUE[z].seatCounts.forEach((n,i)=>{
    const x=rowX0(z,i), y=rowY(z,i);
    x0=Math.min(x0,x); x1=Math.max(x1,x+n*P);
    y0=Math.min(y0,y); y1=Math.max(y1,y);
  });
  return {x0,x1,y0,y1};
}
function seatState(code,room){
  if(foundEntry&&code===foundEntry.seat) return 's-you';
  const c=parseSeat(code); if(c&&inFoundRows(c.zone,c.row)) return 's-row';
  return 's-empty';
}

// ══════════════════════════════════════════════════════
//  RENDER: ALL ZONES — ผังรวมแบบเดียวกับรูปผังจริง (SVG)
// ══════════════════════════════════════════════════════
function renderAll(){
  const room=foundEntry?.room||null;
  const fz=foundEntry?parseSeat(foundEntry.seat)?.zone:null;
  let s=`<svg class="venue-svg" viewBox="215 115 1490 885" role="img" aria-label="ผังที่นั่ง">`;

  // โครงสร้าง: โพเดียม, บันได/ทางเดินกลาง, เส้นแบ่งโซน, เวที
  // บันได (แทนบล็อกสีเทาใหญ่): ขั้นบันไดกว้างขึ้นเมื่อเข้าใกล้ชั้นล่าง
  s+=`<line class="sv-rail" x1="935" y1="296" x2="896" y2="492"/><line class="sv-rail" x1="985" y1="296" x2="1024" y2="492"/>`;
  for(let k=0;k<=14;k++){const y=296+k*14, t=(y-296)/196;
    const xl=935-39*t, xr=985+39*t;
    s+=`<line class="sv-step" x1="${xl.toFixed(1)}" y1="${y}" x2="${xr.toFixed(1)}" y2="${y}"/>`;}
  s+=`<path class="sv-stage-arc" d="M570 950 Q968 902 1367 950"/>`;
  s+=`<rect class="sv-stage" x="560" y="952" width="816" height="40" rx="4"/>`;
  s+=`<text class="sv-stage-txt" x="968" y="973">STAGE · เวที</text>`;


  // โซน
  let ring='';
  for(const Z of 'ABCDEFGHI'){
    const v=VENUE[Z], b=zoneBox(Z);
    s+=`<g class="sv-zone${Z===fz?' found':''}" onclick="selectZone('${Z}')"><title>โซน ${Z} · ${v.floor} · ${totalSeats(Z)} ที่นั่ง</title>`;
    s+=`<rect class="sv-hit" x="${b.x0-8}" y="${b.y0-SEAT_H/2-8}" width="${b.x1-b.x0+16}" height="${b.y1-b.y0+SEAT_H+16}" rx="10"/>`;
    v.seatCounts.forEach((n,i)=>{
      const x0=rowX0(Z,i), y=rowY(Z,i);
      const rowPad=String(v.startRow+i).padStart(2,'0');
      if(inFoundRows(Z,v.startRow+i))
        ring+=`<rect class="sv-rowhl" x="${(x0-6).toFixed(1)}" y="${(y-SEAT_H/2-5).toFixed(1)}" width="${((n-1)*P+SEAT_W+12).toFixed(1)}" height="${SEAT_H+10}" rx="6"/>`;
      for(let k=1;k<=n;k++){
        const code=`${Z}${rowPad}-${k}`, st=seatState(code,room);
        const x=x0+(k-1)*P;
        s+=`<rect class="sv-seat ${st}" x="${x.toFixed(1)}" y="${(y-SEAT_H/2).toFixed(1)}" width="${SEAT_W}" height="${SEAT_H}" rx="2"><title>${code}</title></rect>`;
        if(st==='s-you') ring=`<circle class="sv-ring" cx="${(x+SEAT_W/2).toFixed(1)}" cy="${y.toFixed(1)}" r="16"/>`;
      }
    });
    // วางตัวอักษรที่จุดศูนย์กลางของที่นั่งทั้งหมดในโซน (กึ่งกลางตามรูปทรงจริง)
    let cx=0,cy=0,cnt=0;
    v.seatCounts.forEach((n,i)=>{const x0=rowX0(Z,i),y=rowY(Z,i);cx+=n*(x0+((n-1)*P+SEAT_W)/2);cy+=n*y;cnt+=n;});
    s+=`<text class="sv-label${Z==='G'?' sm':''}" x="${(cx/cnt).toFixed(1)}" y="${(cy/cnt).toFixed(1)}">${Z}</text>`;
    s+=`</g>`;
  }
  s+=ring+`</svg>`;

  document.getElementById('mapBody').innerHTML=
    s+
    (fz?`<div class="map-hint found">ที่นั่งของคุณอยู่ <b>โซน ${fz}</b> · <button class="hint-btn" onclick="selectZone('${fz}')">ดูโซน ${fz} แบบละเอียด →</button></div>`:`<div class="map-hint">แตะที่โซนเพื่อดูที่นั่งแบบละเอียด</div>`);
}

// ══════════════════════════════════════════════════════
//  RENDER: SINGLE ZONE — รูปทรงเดียวกับในผังรวม (ขยายใหญ่)
// ══════════════════════════════════════════════════════
function renderSingle(zone){
  const v=VENUE[zone];
  if(!v)return;
  const room=foundEntry?.room||null;
  const b=zoneBox(zone);

  let html=`
    <div class="zone-detail-header">
      <div class="zone-badge">โซน ${zone}</div>
      <div class="zone-info-text">${v.floor} · แถว ${v.startRow}–${endRow(zone)} · ${totalSeats(zone)} ที่นั่ง</div>
      <button class="back-btn" onclick="selectZone('all')">← ผังรวม</button>
    </div>
    <div class="legend">
      <div class="leg-item"><div class="leg-pip lp-you"></div>${rowOnly()?'พื้นที่ของคุณ (นั่งที่ไหนในแถวที่ไฮไลต์ก็ได้)':'ที่นั่งของคุณ'}</div>
      <div class="leg-item"><div class="leg-pip lp-empty"></div>ว่าง</div>
    </div>
    <div class="zone-inner">
      <div class="zgrid">
      <div class="zone-back-label">▲ ด้านหลัง</div>`;

  for(let i=v.seatCounts.length-1;i>=0;i--){
    const n=v.seatCounts[i];
    const rowPad=String(v.startRow+i).padStart(2,'0');
    const off=((rowX0(zone,i)-b.x0)/P).toFixed(2);
    const hl=inFoundRows(zone,v.startRow+i);
    html+=`<div class="seat-row${hl?' row-hl':''}"><div class="row-num">${rowPad}</div><div class="seat-cells" style="margin-left:calc(var(--cell) * ${off})">`;
    for(let k=1;k<=n;k++){
      const code=`${zone}${rowPad}-${k}`, st=seatState(code,room);
      const lbl=st==='s-you'?'★':k;
      const who=st==='s-taken'?' — '+bySeat[room+':'+code]:'';
      html+=`<div class="seat ${st}" title="${code}${who}">${lbl}</div>`;
    }
    html+=`</div></div>`;
  }

  html+=`
      <div class="stage-mini">▼ เวที (STAGE)</div>
      </div>
    </div>`;

  document.getElementById('mapBody').innerHTML=html;
  setTimeout(()=>{
    const hls=document.querySelectorAll('.seat-row.row-hl');const you=document.querySelector('.seat.s-you')||hls[Math.floor(hls.length/2)];
    if(you) you.scrollIntoView({behavior:'smooth',block:'center',inline:'center'});
  },100);
}

// ── Search ────────────────────────────────────────────
// ══════════════════════════════════════════════════════
//  เชื่อมกับ Google Sheets
//  วาง URL ของ Web App (ลงท้ายด้วย /exec) ระหว่างเครื่องหมาย ' '
//  ถ้าเว้นว่างไว้ ระบบจะใช้ข้อมูล DATA / GROUPS ในไฟล์นี้แทน
// ══════════════════════════════════════════════════════
const API_URL = 'https://script.google.com/macros/s/AKfycbwI8Rd04t53nhSJEBZGdldRErZ1SFjIa-FkMUSIKnDxWoj0KXW8hQNYMyGssP0Og3UFaQ/exec';

function showError(msg){
  const c=document.getElementById('errCard');
  c.textContent=msg; c.hidden=false;
  foundEntry=null; activeZone='all'; updateTabs(); renderAll();
}

async function lookup(q){
  if(!API_URL) return byId[q]||null;
  const r=await fetch(API_URL+'?id='+encodeURIComponent(q));
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json();
  return j.found?{id:j.id,room:j.room,seat:String(j.seat||'').toUpperCase(),advisor:j.advisor||''}:null;
}

async function doSearch(){
  const q=document.getElementById('sid').value.trim().toUpperCase();
  const btn=document.querySelector('.s-btn');
  document.getElementById('errCard').hidden=true;
  document.getElementById('infoStrip').hidden=true;
  if(!q)return;

  btn.disabled=true; btn.textContent='กำลังค้นหา…';
  let s;
  try{ s=await lookup(q); }
  catch(e){ console.error(e); showError('เชื่อมต่อฐานข้อมูลไม่ได้ ลองใหม่อีกครั้ง'); return; }
  finally{ btn.disabled=false; btn.textContent='ค้นหา'; }

  if(!s){ showError(`ไม่พบรหัสนักศึกษา "${q}" ในระบบ`); return; }
  if(!parseSeat(s.seat)){ showError(`รหัส ${q} ยังไม่ได้กำหนดที่นั่ง`); return; }

  foundEntry=s;
  const p=parseSeat(s.seat);
  document.getElementById('rId').textContent=s.id;
  document.getElementById('rRoom').textContent=s.room||'—';
  document.getElementById('rAdvisor').textContent=s.advisor||'—';
  document.getElementById('rSeat').textContent=s.seat;
  document.getElementById('rZone').textContent=p?.zone?'โซน '+p.zone:'—';
  document.getElementById('rZoneSub').textContent=p?.zone&&VENUE[p.zone]?VENUE[p.zone].floor:'';
  document.getElementById('rDesc').textContent=descSeat(p);
  document.getElementById('infoStrip').hidden=false;

  // แสดงผังรวมก่อน ให้ผู้ใช้กดเข้าโซนเองเพื่อดูแบบละเอียด
  activeZone='all'; updateTabs(); renderAll();
  setTimeout(()=>document.getElementById('infoStrip').scrollIntoView({behavior:'smooth',block:'start'}),80);
}

// ── Input ─────────────────────────────────────────────
const inp=document.getElementById('sid');
inp.addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});
inp.addEventListener('input',e=>{
  const p=e.target.selectionStart;
  e.target.value=e.target.value.toUpperCase();
  e.target.setSelectionRange(p,p);
});

// ── Boot ──────────────────────────────────────────────
//  ลิงก์จากระบบอื่นได้:
//    ?id=B6837136          ค้นหารหัสนี้ให้อัตโนมัติ
//    ?embed=1              ซ่อนหัวเว็บ (สำหรับฝังใน iframe)
//    ?id=B6837136&embed=1  ฝังแล้วแสดงผลทันที ซ่อนช่องค้นหา
const params=new URLSearchParams(location.search);
if(params.get('embed')==='1'){
  document.querySelector('.hdr')?.remove();
  document.querySelector('.gold-stripe')?.remove();
  if(params.get('id')) document.querySelector('.search-card').hidden=true;
}
renderAll();
if(params.get('id')){
  inp.value=params.get('id').trim().toUpperCase();
  doSearch();
}
</script>
</body>
</html>
